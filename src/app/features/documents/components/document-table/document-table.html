<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th scope="col">Documento</th>
        <th scope="col" class="col-date">Subido</th>
        <th scope="col" class="col-id">ID</th>
        <th scope="col" class="col-actions">
          <span class="sr-only">Acciones</span>
        </th>
      </tr>
    </thead>
    <tbody>
      @for (doc of documents(); track doc.id) {
        <tr>
          <td>
            <div class="doc">
              <span class="doc__icon">
                <app-icon name="documents" [size]="17" />
              </span>
              <span class="doc__meta">
                <strong class="truncate" [title]="doc.filename">{{ doc.filename }}</strong>
                <small class="truncate" [title]="doc.filepath">{{ doc.filepath }}</small>
              </span>
            </div>
          </td>
          <td class="col-date">
            <span class="date">{{ doc.uploaded_at | date: 'd MMM yyyy' }}</span>
            <small class="date__time">{{ doc.uploaded_at | date: 'HH:mm' }}</small>
          </td>
          <td class="col-id">
            <code>{{ shortId(doc.id) }}</code>
          </td>
          <td class="col-actions">
            <button
              type="button"
              class="icon-btn"
              [attr.aria-label]="'Copiar ID de ' + doc.filename"
              title="Copiar ID"
              (click)="copyId.emit(doc.id)"
            >
              <app-icon name="copy" [size]="16" />
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="empty-row">Sin documentos indexados.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
