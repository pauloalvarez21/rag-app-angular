<div
  class="dropzone"
  [class.dropzone--active]="dragging()"
  [class.dropzone--disabled]="disabled()"
  role="button"
  tabindex="0"
  [attr.aria-disabled]="disabled()"
  (click)="openPicker(picker)"
  (keydown.enter)="openPicker(picker)"
  (keydown.space)="openPicker(picker); $event.preventDefault()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <input
    #picker
    type="file"
    class="sr-only"
    [accept]="accept()"
    [disabled]="disabled()"
    (click)="$event.stopPropagation()"
    (change)="onPick($event)"
  />

  <span class="dropzone__icon">
    <app-icon name="upload" [size]="22" />
  </span>

  <p class="dropzone__title">Arrastra tu PDF aquí</p>
  <p class="dropzone__hint">o haz clic para seleccionarlo desde tu equipo</p>
  <span class="dropzone__meta">PDF · máximo {{ maxSizeMb() }} MB</span>
</div>
